schema_version: 1
version: "1.2.0"
application:
  name: elasticsearch
  version: ">=9.0.0, <10.0.0"
resource_types:
  ingest_pipelines:
    - id: { pointer: /id, scope: universal }
      display_name: { pointer: /name, strategy: name_id }
      write_intent: upsert
      mutation_mode: replace
      sensitive_fields: [/_secret]
      transformations:
        - { kind: remove, pointer: /created_date_millis }
        - { kind: remove, pointer: /modified_date_millis }
        - { kind: omit, pointer: /id }
      operations:
        read: { method: GET, path: "/_ingest/pipeline/{id}", cardinality: one, extract: "/{id}" }
        list: { method: GET, path: "/_ingest/pipeline", cardinality: many }
        create: { method: PUT, path: "/_ingest/pipeline/{id}?create=true", cardinality: one, retry_safe: true }
        update: { method: PUT, path: "/_ingest/pipeline/{id}", cardinality: one, retry_safe: true }
        upsert: { method: PUT, path: "/_ingest/pipeline/{id}", cardinality: one, retry_safe: true, trustworthy_response: false }
        delete: { method: DELETE, path: "/_ingest/pipeline/{id}", cardinality: one, retry_safe: true }
  ilm_policies:
    - id: { pointer: /id, scope: universal }
      display_name: { pointer: /id, strategy: name, unique: true }
      write_intent: update
      mutation_mode: replace
      transformations:
        - { kind: remove, pointer: /version }
        - { kind: remove, pointer: /modified_date }
        - { kind: remove, pointer: /modified_date_millis }
        - { kind: remove, pointer: /in_use_by }
        - { kind: omit, pointer: /id }
      operations:
        read: { method: GET, path: "/_ilm/policy/{id}", cardinality: one, extract: "/{id}", retry_safe: true, concurrency: parallel }
        list: { method: GET, path: "/_ilm/policy", cardinality: many, retry_safe: true, concurrency: parallel }
        update:
          method: PUT
          path: "/_ilm/policy/{id}"
          cardinality: one
          retry_safe: true
          trustworthy_response: false
          transformations: [{ kind: frame, pointer: /policy }]
        delete: { method: DELETE, path: "/_ilm/policy/{id}", cardinality: one, retry_safe: true }
  component_templates:
    - id: { pointer: /name, scope: universal }
      display_name: { pointer: /name, strategy: name, unique: true }
      write_intent: upsert
      mutation_mode: replace
      transformations:
        - { kind: remove, pointer: /component_template/created_date_millis }
        - { kind: remove, pointer: /component_template/modified_date_millis }
      operations:
        read: { method: GET, path: "/_component_template/{id}", cardinality: one, extract: "/component_templates/0", retry_safe: true, concurrency: parallel }
        list: { method: GET, path: "/_component_template", cardinality: many, extract: "/component_templates", retry_safe: true, concurrency: parallel }
        create:
          method: PUT
          path: "/_component_template/{id}?create=true"
          cardinality: one
          retry_safe: true
          transformations: [{ kind: frame, pointer: /component_template }]
        update:
          method: PUT
          path: "/_component_template/{id}"
          cardinality: one
          retry_safe: true
          transformations: [{ kind: frame, pointer: /component_template }]
        delete: { method: DELETE, path: "/_component_template/{id}", cardinality: one, retry_safe: true }
  index_templates:
    - id: { pointer: /name, scope: universal }
      display_name: { pointer: /name, strategy: name, unique: true }
      write_intent: upsert
      mutation_mode: replace
      dependencies: [component_templates]
      transformations:
        - { kind: remove, pointer: /index_template/created_date_millis }
        - { kind: remove, pointer: /index_template/modified_date_millis }
      operations:
        read: { method: GET, path: "/_index_template/{id}", cardinality: one, extract: "/index_templates/0", retry_safe: true, concurrency: parallel }
        list: { method: GET, path: "/_index_template", cardinality: many, extract: "/index_templates", retry_safe: true, concurrency: parallel }
        create:
          method: PUT
          path: "/_index_template/{id}?create=true"
          cardinality: one
          retry_safe: true
          transformations: [{ kind: frame, pointer: /index_template }]
        update:
          method: PUT
          path: "/_index_template/{id}"
          cardinality: one
          retry_safe: true
          transformations: [{ kind: frame, pointer: /index_template }]
        delete: { method: DELETE, path: "/_index_template/{id}", cardinality: one, retry_safe: true }
  roles:
    - id: { pointer: /id, scope: universal }
      display_name: { pointer: /id, strategy: name, unique: true }
      write_intent: upsert
      mutation_mode: replace
      transformations:
        - { kind: remove, pointer: /transient_metadata }
        - { kind: omit, pointer: /id }
      operations:
        read: { method: GET, path: "/_security/role/{id}", cardinality: one, extract: "/{id}", retry_safe: true, concurrency: parallel }
        list: { method: GET, path: "/_security/role", cardinality: many, retry_safe: true, concurrency: parallel }
        upsert: { method: PUT, path: "/_security/role/{id}", cardinality: one, retry_safe: true, trustworthy_response: false }
        delete: { method: DELETE, path: "/_security/role/{id}", cardinality: one, retry_safe: true }
  snapshot_repositories:
    - id: { pointer: /id, scope: universal }
      display_name: { pointer: /id, strategy: name, unique: true }
      write_intent: upsert
      mutation_mode: replace
      transformations:
        - { kind: remove, pointer: /uuid }
        - { kind: remove, pointer: /generation }
        - { kind: remove, pointer: /pending_generation }
        - { kind: omit, pointer: /id }
      operations:
        read: { method: GET, path: "/_snapshot/{id}", cardinality: one, extract: "/{id}", retry_safe: true, concurrency: parallel }
        list: { method: GET, path: "/_snapshot", cardinality: many, retry_safe: true, concurrency: parallel }
        upsert: { method: PUT, path: "/_snapshot/{id}", cardinality: one, retry_safe: true, trustworthy_response: false }
        delete: { method: DELETE, path: "/_snapshot/{id}", cardinality: one, retry_safe: true }
  legacy_index_templates:
    - id: { pointer: /id, scope: universal }
      display_name: { pointer: /id, strategy: name, unique: true }
      write_intent: upsert
      mutation_mode: replace
      transformations:
        - { kind: omit, pointer: /id }
      operations:
        read: { method: GET, path: "/_template/{id}", cardinality: one, extract: "/{id}", retry_safe: true, concurrency: parallel }
        list: { method: GET, path: "/_template", cardinality: many, retry_safe: true, concurrency: parallel }
        create: { method: PUT, path: "/_template/{id}?create=true", cardinality: one, retry_safe: true, trustworthy_response: false }
        update: { method: PUT, path: "/_template/{id}", cardinality: one, retry_safe: true, trustworthy_response: false }
        delete: { method: DELETE, path: "/_template/{id}", cardinality: one, retry_safe: true }
  role_mappings:
    - id: { pointer: /id, scope: universal }
      display_name: { pointer: /id, strategy: name, unique: true }
      write_intent: upsert
      mutation_mode: replace
      transformations:
        - { kind: omit, pointer: /id }
      operations:
        read: { method: GET, path: "/_security/role_mapping/{id}", cardinality: one, extract: "/{id}", retry_safe: true, concurrency: parallel }
        list: { method: GET, path: "/_security/role_mapping", cardinality: many, retry_safe: true, concurrency: parallel }
        upsert: { method: PUT, path: "/_security/role_mapping/{id}", cardinality: one, retry_safe: true, trustworthy_response: false }
        delete: { method: DELETE, path: "/_security/role_mapping/{id}", cardinality: one, retry_safe: true }
  slm_policies:
    - id: { pointer: /id, scope: universal }
      display_name: { pointer: /id, strategy: name, unique: true }
      write_intent: upsert
      mutation_mode: replace
      dependencies: [snapshot_repositories]
      transformations:
        - { kind: remove, pointer: /version }
        - { kind: remove, pointer: /modified_date }
        - { kind: remove, pointer: /modified_date_millis }
        - { kind: remove, pointer: /next_execution }
        - { kind: remove, pointer: /next_execution_millis }
        - { kind: remove, pointer: /stats }
        - { kind: remove, pointer: /in_progress }
        - { kind: omit, pointer: /id }
      operations:
        read: { method: GET, path: "/_slm/policy/{id}", cardinality: one, extract: "/{id}", retry_safe: true, concurrency: parallel }
        list: { method: GET, path: "/_slm/policy", cardinality: many, retry_safe: true, concurrency: parallel }
        upsert:
          method: PUT
          path: "/_slm/policy/{id}"
          cardinality: one
          retry_safe: true
          trustworthy_response: false
          transformations: [{ kind: frame, pointer: /policy }]
        delete: { method: DELETE, path: "/_slm/policy/{id}", cardinality: one, retry_safe: true }
  ccr_auto_follow_patterns:
    - id: { pointer: /name, scope: universal }
      display_name: { pointer: /name, strategy: name, unique: true }
      write_intent: upsert
      mutation_mode: replace
      transformations:
        - { kind: remove, pointer: /pattern/active }
      operations:
        read: { method: GET, path: "/_ccr/auto_follow/{id}", cardinality: one, extract: "/patterns/0", retry_safe: true, concurrency: parallel }
        list: { method: GET, path: "/_ccr/auto_follow", cardinality: many, extract: "/patterns", retry_safe: true, concurrency: parallel }
        upsert:
          method: PUT
          path: "/_ccr/auto_follow/{id}"
          cardinality: one
          retry_safe: true
          trustworthy_response: false
          transformations: [{ kind: frame, pointer: /pattern }]
        delete: { method: DELETE, path: "/_ccr/auto_follow/{id}", cardinality: one, retry_safe: true }
  cluster_settings:
    - id: { pointer: /id, scope: target }
      display_name: { pointer: /id, strategy: name, unique: true }
      write_intent: update
      mutation_mode: replace
      transformations:
        - { kind: omit, pointer: /id }
      operations:
        read: { method: GET, path: "/_cluster/settings?flat_settings=true", cardinality: one, retry_safe: true }
        update: { method: PUT, path: "/_cluster/settings", cardinality: one, retry_safe: true, trustworthy_response: false }
  enrich_policies:
    - id: { pointer: /policy/name, scope: universal }
      display_name: { pointer: /policy/name, strategy: name, unique: true }
      write_intent: create
      mutation_mode: replace
      transformations:
        - { kind: singleton_map, pointer: /config, key_pointer: /policy_type, value_pointer: /policy }
        - { kind: remove, pointer: /policy/elasticsearch_version }
        - { kind: omit, pointer: /policy/name }
      operations:
        read: { method: GET, path: "/_enrich/policy/{id}", cardinality: one, extract: "/policies/0", extract_missing: not_found, retry_safe: true, concurrency: parallel }
        list: { method: GET, path: "/_enrich/policy", cardinality: many, extract: "/policies", retry_safe: true, concurrency: parallel }
        create:
          method: PUT
          path: "/_enrich/policy/{id}"
          cardinality: one
          retry_safe: true
          trustworthy_response: false
          transformations: [{ kind: frame, pointer: /config }]
        delete: { method: DELETE, path: "/_enrich/policy/{id}", cardinality: one, retry_safe: true }
