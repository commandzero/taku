[package]
name = "resource-control"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4"
json5 = "0.4"
pulldown-cmark = { version = "0.13.4", default-features = false }
redact = "0.1.11"
rayon = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rust-embed = { version = "8.12", features = ["debug-embed", "deterministic-timestamps", "include-exclude"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.20"
