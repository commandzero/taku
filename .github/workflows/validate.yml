name: Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select checks
        id: scope
        shell: bash
        run: |
          mode=all
          if [[ -n "$BASE_REF" ]] && git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            changed=$(git diff --no-renames --name-only "$BASE_REF...HEAD")
            if ! printf '%s\n' "$changed" | rg -qv '^(docs/|openspec/|[^/]+\.md$|$)'; then
              mode=docs
            fi
          else
            echo 'BASE_REF=' >> "$GITHUB_ENV"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Install development toolchain
        shell: bash
        run: |
          toolchain=$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          echo "TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: preflight-${{ runner.os }}-${{ env.TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install validation tools
        run: |
          cargo install okf --version 0.2.7 --locked
          npm install --global @fission-ai/openspec@1.11.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Run shared preflight
        env:
          MODE: ${{ steps.scope.outputs.mode }}
        run: bash scripts/preflight.sh "$MODE"

  minimum:
    name: minimum compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install and test minimum compiler
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -n "$BASE_REF" ]] && git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            if ! git diff --no-renames --name-only "$BASE_REF...HEAD" | rg -qv '^(docs/|openspec/|[^/]+\.md$|$)'; then
              echo 'Documentation-only change: minimum compiler check not applicable'
              exit 0
            fi
          fi
          minimum=$(awk -F '"' '/^rust-version = / { print $2 }' Cargo.toml)
          rustup toolchain install "$minimum.0" --profile minimal
          bash scripts/preflight.sh msrv

  contract:
    name: PR contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate PR title and associated OpenSpec changes
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          toolchain=$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          npm install --global @fission-ai/openspec@1.11.0
          bash scripts/check-pr.sh
      - name: Not a pull request
        if: github.event_name != 'pull_request'
        run: echo 'PR contract not applicable'
