name: Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull_request runner has no repository secrets or write token. It is the
  # only job that executes code supplied by a pull request.
  preflight:
    name: preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Save trusted contract gates
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/taku-gates"
          git show "$BASE_SHA:rust-toolchain.toml" > "$RUNNER_TEMP/taku-gates/rust-toolchain.toml"
          for file in scripts/check-pr.sh scripts/check-docs.sh scripts/check-openspec.sh scripts/check-openspec.rs; do
            git show "$BASE_SHA:$file" > "$RUNNER_TEMP/taku-gates/$(basename "$file")"
          done
      - name: Install development tools
        shell: bash
        run: |
          toolchain=$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Install trusted contract tools
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          toolchain=$(awk -F '"' '/^channel = / { print $2 }' "$RUNNER_TEMP/taku-gates/rust-toolchain.toml")
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          cargo install okf --version 0.2.7 --locked
          npm install --global @fission-ai/openspec@1.11.0
      - name: Run code preflight
        shell: bash
        run: |
          toolchain=$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)
          rustup run "$toolchain" cargo fmt --all -- --check
          shellcheck scripts/*.sh
          actionlint
          for script in scripts/*.sh; do bash -n "$script"; done
          rustup run "$toolchain" rustfmt --edition 2024 --check scripts/check-openspec.rs
          rustup run "$toolchain" cargo clippy --workspace --all-targets --locked -- -D warnings
          rustup run "$toolchain" cargo test --workspace --locked
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          rustup run "$toolchain" rustc --edition 2024 -D warnings --test scripts/check-openspec.rs -o "$staging/tests"
          "$staging/tests"
      - name: Run trusted PR contract
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO_ROOT: ${{ github.workspace }}
          OPENSPEC_GATE_SOURCE: ${{ runner.temp }}/taku-gates/check-openspec.rs
        run: |
          export BASE_REF="$BASE_SHA"
          toolchain=$(awk -F '"' '/^channel = / { print $2 }' "$RUNNER_TEMP/taku-gates/rust-toolchain.toml")
          export OPENSPEC_TOOLCHAIN="$toolchain"
          bash "$RUNNER_TEMP/taku-gates/check-docs.sh"
          bash "$RUNNER_TEMP/taku-gates/check-pr.sh"
          bash "$RUNNER_TEMP/taku-gates/check-openspec.sh"

  minimum:
    name: minimum compiler
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Run minimum compiler tests
        run: rustup run 1.89.0 cargo test --workspace --locked

  # pull_request_target uses the workflow from the base branch. It executes
  # only pinned tools and gate code copied from that trusted revision; it never
  # builds or runs the PR's Rust code.
  contract:
    name: PR contract
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha }}
      TRUSTED_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Save trusted contract gates
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/taku-gates"
          awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml > "$RUNNER_TEMP/taku-gates/toolchain"
          for file in scripts/check-pr.sh scripts/check-docs.sh scripts/check-openspec.sh scripts/check-openspec.rs; do
            git show "$TRUSTED_REF:$file" > "$RUNNER_TEMP/taku-gates/$(basename "$file")"
          done
      - name: Install trusted validation tools
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          toolchain=$(cat "$RUNNER_TEMP/taku-gates/toolchain")
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          cargo install okf --version 0.2.7 --locked
          npm install --global @fission-ai/openspec@1.11.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate documentation and PR contract
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO_ROOT: ${{ github.workspace }}
          OPENSPEC_GATE_SOURCE: ${{ runner.temp }}/taku-gates/check-openspec.rs
        run: |
          toolchain=$(cat "$RUNNER_TEMP/taku-gates/toolchain")
          export OPENSPEC_TOOLCHAIN="$toolchain"
          bash "$RUNNER_TEMP/taku-gates/check-docs.sh"
          bash "$RUNNER_TEMP/taku-gates/check-pr.sh"

  # Main and manually dispatched runs use trusted source from this repository.
  main:
    name: main preflight
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install validation tools
        run: |
          toolchain=$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          cargo install okf --version 0.2.7 --locked
          npm install --global @fission-ai/openspec@1.11.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Run complete preflight
        run: bash scripts/preflight.sh all
