[package]
name = "taku"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Git-versioned control for configured remote resources"
readme = "README.md"
keywords = ["cli", "configuration", "git", "http"]
categories = ["command-line-utilities"]
include = ["/Cargo.toml", "/Cargo.lock", "/src/**", "/README.md", "/LICENCE.md", "/NOTICES.md"]
publish = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
resource-control = { version = "=0.1.0", path = "crates/resource-control" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2.0"
dotenvy = "0.15.7"
predicates = "3.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3.20"
tiny_http = "0.12"

[workspace]
members = ["crates/resource-control"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/commandzero/taku"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
