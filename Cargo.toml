[package]
name = "taku"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
resource-control = { path = "crates/resource-control" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2.0"
dotenvy = "0.15.7"
predicates = "3.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3.20"
tiny_http = "0.12"

[workspace]
members = ["crates/resource-control"]
